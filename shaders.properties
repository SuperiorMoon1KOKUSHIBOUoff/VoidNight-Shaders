# Profiles
profile.LOW=shadowMapResolution:512 shadowDistance:64 WATER_WAVE:0.03 WATER_SPEED:0.25 RAIN_REFLECTION:0.0 BLOOM_STRENGTH:0.10
profile.MEDIUM=shadowMapResolution:1024 shadowDistance:96 WATER_WAVE:0.06 WATER_SPEED:0.45 RAIN_REFLECTION:1.0 BLOOM_STRENGTH:0.15
profile.HIGH=shadowMapResolution:2048 shadowDistance:128 WATER_WAVE:0.08 WATER_SPEED:0.55 RAIN_REFLECTION:1.0 BLOOM_STRENGTH:0.18
profile.ULTRA=shadowMapResolution:4096 shadowDistance:160 WATER_WAVE:0.12 WATER_SPEED:0.70 RAIN_REFLECTION:1.0 BLOOM_STRENGTH:0.22

# Screens
screen=<profile> [FOG] [LIGHTING] [WATER] [POST]
screen.FOG=FOG_DENSITY FOG_HEIGHT
screen.LIGHTING=SHADOW_STRENGTH
screen.WATER=WATER_SPEED WATER_WAVE WATER_TINT
screen.POST=BLOOM_STRENGTH VIGNETTE FILM_GRAIN SATURATION CONTRAST BRIGHTNESS
screen.columns=2
screen.FOG.columns=2
screen.LIGHTING.columns=2
screen.WATER.columns=2
screen.POST.columns=2

# Standard OptiFine settings
oldLighting=false
oldHandLight=true
shadow.culling=true
frustum.culling=true
